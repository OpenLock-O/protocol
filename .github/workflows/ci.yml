name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace at the declared minimum
        run: cargo +1.85.0 check --locked --workspace --all-targets

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Fetch Rust dependencies
        run: devenv shell -- sh -c 'CARGO_NET_OFFLINE=false cargo fetch'

      - name: Check formatting and lints
        run: devenv shell -- check

      - name: Run tests
        run: devenv shell -- unit-tests

      - name: Build workspace
        run: devenv shell -- build

      - name: Test no_std and build ARM / RISC-V runtime libraries
        run: devenv shell -- no-std-check

  esp32:
    name: ESP32 / ESP-IDF (std)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32,esp32s2,esp32s3
          override: false

      - name: Install Rust for RISC-V ESP-IDF
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Build ESP-IDF runtime libraries with std
        run: bash scripts/check-esp32.sh

  bindings:
    name: Swift, Kotlin and JNI bindings
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Fetch Rust dependencies
        run: devenv shell -- sh -c 'CARGO_NET_OFFLINE=false cargo fetch'

      - name: Run C, Swift and Kotlin lifecycle integration
        run: devenv shell -- scripts/check-bindings.sh
