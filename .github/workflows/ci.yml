name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Fetch Rust dependencies
        run: devenv shell -- sh -c 'CARGO_NET_OFFLINE=false cargo fetch'

      - name: Check formatting and lints
        run: devenv shell -- check

      - name: Run tests
        run: devenv shell -- unit-tests

      - name: Build workspace
        run: devenv shell -- build

      - name: Check no_std embedded target
        run: devenv shell -- no-std-check

  bindings:
    name: Swift, Kotlin and JNI bindings
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Fetch Rust dependencies
        run: devenv shell -- sh -c 'CARGO_NET_OFFLINE=false cargo fetch'

      - name: Run C, Swift and Kotlin lifecycle integration
        run: devenv shell -- scripts/check-bindings.sh
