name: OpenLock
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Simulator: debug
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  OpenLock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - ActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlock.app
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
      configs:
        Simulator:
          SDKROOT: iphonesimulator
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: OpenLock
        NSBluetoothAlwaysUsageDescription: OpenLock 需要使用蓝牙查找并操作你添加的门锁。
        NSLocationWhenInUseUsageDescription: OpenLock 使用你的位置推荐附近的门锁，也可为门锁记录位置。位置不会触发自动开锁。
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - bluetooth-central
        CFBundleURLTypes:
          - CFBundleURLName: dev.openlock.app.door
            CFBundleURLSchemes:
              - openlock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: OpenLockWidgets
        embed: true
        link: false
      - target: OpenLockWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}

  OpenLockWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlock.app.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
      configs:
        Simulator:
          SDKROOT: watchsimulator
    info:
      path: Config/watchOS-Info.plist
      properties:
        CFBundleDisplayName: OpenLock
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.openlock.app
        WKRunsIndependentlyOfCompanionApp: true
        NSBluetoothAlwaysUsageDescription: OpenLock 需要使用蓝牙从 Apple Watch 独立查找并操作你添加的门锁。
        NSLocationWhenInUseUsageDescription: OpenLock 使用你的位置推荐附近的门锁。位置不会触发自动开锁。
    scheme: {}

  OpenLockWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ActivityShared
      - Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openlock.app.widgets
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Simulator:
          SDKROOT: iphonesimulator
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: OpenLock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    scheme: {}
