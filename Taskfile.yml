version: '3'

vars:
  APPLE_ENV: /usr/bin/env -u AR -u CC -u CXX -u LD

tasks:
  default:
    cmds:
      - task --list

  generate:
    desc: Generate the iOS and Apple Watch Xcode project
    preconditions:
      - sh: command -v xcodegen
        msg: Run this task inside devenv shell on macOS.
    cmds:
      - xcodegen generate --spec project.yml

  test:
    desc: Test the shared protocol and data model using Apple's Swift toolchain
    preconditions:
      - sh: test "$(uname -s)" = Darwin
        msg: Core tests require macOS and the Apple Swift toolchain.
    cmds:
      - '{{.APPLE_ENV}} /usr/bin/xcrun swift test'

  build-ios:
    desc: Build the iOS app and embedded Watch app for simulators
    deps: [generate]
    cmds:
      - >-
        {{.APPLE_ENV}} /usr/bin/xcodebuild
        -project OpenLock.xcodeproj -target OpenLock
        -configuration Simulator
        SYMROOT='{{.TASKFILE_DIR}}/.build/DerivedData/Build/Products'
        OBJROOT='{{.TASKFILE_DIR}}/.build/DerivedData/Build/Intermediates.noindex'
        CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build

  build-watch:
    desc: Build the Apple Watch app for the simulator
    deps: [generate]
    cmds:
      - >-
        {{.APPLE_ENV}} /usr/bin/xcodebuild
        -project OpenLock.xcodeproj -target OpenLockWatch
        -configuration Simulator
        SYMROOT='{{.TASKFILE_DIR}}/.build/DerivedData/Build/Products'
        OBJROOT='{{.TASKFILE_DIR}}/.build/DerivedData/Build/Intermediates.noindex'
        CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build
